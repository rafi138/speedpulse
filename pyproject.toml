[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "speedpulse"
version = "0.1.0"
description = "Cross-platform internet speed monitor for your system tray: live throughput plus on-demand speed tests."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "SpeedPulse contributors" }]
requires-python = ">=3.11"
keywords = ["network", "speed", "monitor", "tray", "bandwidth", "speedtest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "psutil>=5.9.0",
    "PySide6>=6.8.0,<7.0",
]

[project.optional-dependencies]
# ruff and pyright are pinned EXACTLY and must stay in lockstep with
# .pre-commit-config.yaml — CI, pre-commit and contributors all enforce
# the same versions. Bump all three together.
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
    "ruff==0.17.5",
    "pyright==1.1.414",
    "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/rafi138/speedpulse"
Issues = "https://github.com/rafi138/speedpulse/issues"
Changelog = "https://github.com/rafi138/speedpulse/blob/main/CHANGELOG.md"

[project.gui-scripts]
speedpulse = "speedpulse.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/speedpulse"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["dist", "build"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "C4",  # comprehensions
    "RET", # return
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# GUI smoke tests legitimately skip when Qt can't initialise.
"tests/gui/*" = ["B011"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "gui: tests that construct Qt widgets (offscreen in CI)",
]

# ---------------------------------------------------------------- pyright
[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "basic"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
reportMissingImports = "warning"
