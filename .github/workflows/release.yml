name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-linux:
    name: Linux (.deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Qt runtime libraries for PyInstaller build & smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-render0 libxcb-shape0 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-sync1 libxcb-util1 libxcb-xkb1 libxcb1 \
            libdbus-1-3 libfontconfig1 xvfb
      - name: Install build dependencies
        run: python -m pip install -e ".[build]"
      - name: Generate icons
        run: python packaging/make_icons.py
      - name: Build PyInstaller payload
        run: SPEEDPULSE_VERSION="${GITHUB_REF_NAME#v}" pyinstaller packaging/speedpulse.spec --noconfirm
      - name: Smoke test payload (headless)
        run: |
          QT_QPA_PLATFORM=offscreen dist/speedpulse/speedpulse --version
      - name: Smoke test payload under X11 (catches missing xcb runtime libs)
        run: |
          # The app runs until the timeout kills it (124). A fast exit means
          # Qt failed to load its xcb platform plugin - fail the job.
          timeout 6 xvfb-run -a dist/speedpulse/speedpulse --verbose || [ $? -eq 124 ]
      - name: Build .deb
        run: bash packaging/build_deb.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/*.deb
          if-no-files-found: error

  build-windows:
    name: Windows (installer + portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -e ".[build]"
      - name: Generate icons
        run: python packaging/make_icons.py
      - name: Build PyInstaller payload
        run: SPEEDPULSE_VERSION="${GITHUB_REF_NAME#v}" pyinstaller packaging/speedpulse.spec --noconfirm
      - name: Smoke test payload
        run: |
          ./dist/speedpulse/speedpulse.exe --version
      - name: Build installer (Inno Setup, preinstalled on the runner)
        run: |
          # Version via env var: Git Bash mangles /D-style iscc flags into paths
          SPEEDPULSE_VERSION="${GITHUB_REF_NAME#v}" iscc packaging/windows/speedpulse.iss
      - name: Build portable zip
        run: |
          python -c "import shutil; shutil.make_archive('dist/SpeedPulse-${GITHUB_REF_NAME#v}-portable-win64', 'zip', 'dist', 'speedpulse')"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/installer/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: |
            dist/*.zip
          if-no-files-found: error

  build-macos:
    name: macOS (.dmg, Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -e ".[build]"
      - name: Generate icons
        run: python packaging/make_icons.py
      - name: Build PyInstaller payload
        run: SPEEDPULSE_VERSION="${GITHUB_REF_NAME#v}" pyinstaller packaging/speedpulse.spec --noconfirm
      - name: Smoke test payload (headless)
        run: |
          QT_QPA_PLATFORM=offscreen dist/SpeedPulse.app/Contents/MacOS/speedpulse --version
      - name: Build .dmg
        run: |
          hdiutil create -volname SpeedPulse -srcfolder dist/SpeedPulse.app -ov -format UDZO \
            "dist/SpeedPulse-${GITHUB_REF_NAME#v}-macos.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg
          if-no-files-found: error

  build-pypi:
    name: PyPI (sdist + wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build --outdir dist/pypi
          ls -la dist/pypi
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-dists
          path: dist/pypi/*
          if-no-files-found: error

  release:
    name: Assemble GitHub Release
    needs: [build-linux, build-windows, build-macos, build-pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stage release files
        run: |
          mkdir -p release
          find artifacts -type f -print -exec mv {} release/ \;
          cd release
          sha256sum * > SHA256SUMS.txt
          ls -la
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          cat > notes.md <<'NOTES'
          ## SpeedPulse

          Live network throughput in your system tray — plus a floating
          on-desktop widget, and (via `pip`) a headless-friendly package.

          ### Downloads
          | Platform | File |
          |---|---|
          | Linux (Debian/Ubuntu, amd64) | `speedpulse_<version>_amd64.deb` |
          | Windows (installer) | `SpeedPulse-<version>-setup.exe` |
          | Windows (portable) | `SpeedPulse-<version>-portable-win64.zip` |
          | macOS (Apple Silicon) | `SpeedPulse-<version>-macos.dmg` |
          | Python package (also on PyPI) | `speedpulse-<version>.tar.gz` / `.whl` |

          Verify downloads against `SHA256SUMS.txt`.

          ### Install notes
          - **Linux**: `sudo apt install ./speedpulse_<version>_amd64.deb` (requires Ubuntu 24.04+/Debian 13+/Fedora 40+), then launch "SpeedPulse" from your app menu. GNOME needs the *AppIndicator* extension (preinstalled on Ubuntu); KDE/Xfce/Cinnamon work out of the box.
          - **Windows**: run the installer (SmartScreen may warn — unsigned build; "More info → Run anyway") or unpack the portable zip.
          - **macOS**: open the dmg and drag SpeedPulse to Applications. Unsigned build: first launch needs *System Settings → Privacy & Security → Open Anyway* (or `xattr -cr /Applications/SpeedPulse.app`). Built for Apple Silicon.
          - **Tray text too small?** Try Settings → *Tray layout: Side by side* and *Tray text size*, or enable the *floating widget* (tray menu or Settings) for a large, draggable on-desktop display.
          - **PyPI**: `pip install speedpulse` (or `pipx`) once the publish job for this tag has run; the GitHub link lives in the package metadata.
          NOTES
          sed -i "s/<version>/${TAG#v}/g" notes.md
          gh release create "$TAG" release/* --title "SpeedPulse ${TAG#v}" --notes-file notes.md

  publish-pypi:
    name: Publish to PyPI (trusted publishing)
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-dists
          path: dist
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
