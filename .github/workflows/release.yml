name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-linux:
    name: Linux (.deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Qt runtime libraries for PyInstaller build & smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install build dependencies
        run: python -m pip install -e ".[build]"
      - name: Generate icons
        run: python packaging/make_icons.py
      - name: Build PyInstaller payload
        run: pyinstaller packaging/speedpulse.spec --noconfirm
      - name: Smoke test payload (headless)
        run: |
          QT_QPA_PLATFORM=offscreen dist/speedpulse/speedpulse --version
      - name: Build .deb
        run: bash packaging/build_deb.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/*.deb
          if-no-files-found: error

  build-windows:
    name: Windows (installer + portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -e ".[build]"
      - name: Generate icons
        run: python packaging/make_icons.py
      - name: Build PyInstaller payload
        run: pyinstaller packaging/speedpulse.spec --noconfirm
      - name: Smoke test payload
        run: |
          ./dist/speedpulse/speedpulse.exe --version
      - name: Build installer (Inno Setup, preinstalled on the runner)
        run: |
          # Version via env var: Git Bash mangles /D-style iscc flags into paths
          SPEEDPULSE_VERSION="${GITHUB_REF_NAME#v}" iscc packaging/windows/speedpulse.iss
      - name: Build portable zip
        run: |
          python -c "import shutil; shutil.make_archive('dist/SpeedPulse-${GITHUB_REF_NAME#v}-portable-win64', 'zip', 'dist', 'speedpulse')"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/installer/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: |
            dist/*.zip
          if-no-files-found: error

  build-macos:
    name: macOS (.dmg, Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -e ".[build]"
      - name: Generate icons
        run: python packaging/make_icons.py
      - name: Build PyInstaller payload
        run: pyinstaller packaging/speedpulse.spec --noconfirm
      - name: Smoke test payload (headless)
        run: |
          QT_QPA_PLATFORM=offscreen dist/SpeedPulse.app/Contents/MacOS/speedpulse --version
      - name: Build .dmg
        run: |
          hdiutil create -volname SpeedPulse -srcfolder dist/SpeedPulse.app -ov -format UDZO \
            "dist/SpeedPulse-${GITHUB_REF_NAME#v}-macos.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg
          if-no-files-found: error

  release:
    name: Assemble GitHub Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stage release files
        run: |
          mkdir -p release
          find artifacts -type f -print -exec mv {} release/ \;
          cd release
          sha256sum * > SHA256SUMS.txt
          ls -la
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          cat > notes.md <<'NOTES'
          ## SpeedPulse — first release

          Live network throughput in your system tray.

          ### Downloads
          | Platform | File |
          |---|---|
          | Linux (Debian/Ubuntu, amd64) | `speedpulse_<version>_amd64.deb` |
          | Windows (installer) | `SpeedPulse_<version>-setup.exe` |
          | Windows (portable) | `SpeedPulse_<version>-portable-win64.zip` |
          | macOS (Apple Silicon) | `SpeedPulse_<version>-macos.dmg` |

          Verify downloads against `SHA256SUMS.txt`.

          ### Install notes
          - **Linux**: `sudo apt install ./speedpulse_<version>_amd64.deb`, then launch "SpeedPulse" from your app menu. GNOME needs the *AppIndicator* extension (preinstalled on Ubuntu); KDE/Xfce/Cinnamon work out of the box.
          - **Windows**: run the installer (SmartScreen may warn — unsigned build; "More info → Run anyway") or unpack the portable zip.
          - **macOS**: open the dmg and drag SpeedPulse to Applications. Unsigned build: first launch needs *System Settings → Privacy & Security → Open Anyway* (or `xattr -cr /Applications/SpeedPulse.app`). Built for Apple Silicon.
          NOTES
          sed -i "s/<version>/${TAG#v}/g" notes.md
          gh release create "$TAG" release/* --title "SpeedPulse ${TAG#v}" --notes-file notes.md
